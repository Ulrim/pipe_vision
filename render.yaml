# ===== AIVIS 클라우드 운영 — Render Blueprint (2026-10-15 재작성) =====
# 구성: Render(이 파일: api·mes) + Supabase(Postgres·사진) + Vercel(hmi·dashboard 화면)
#       + 현장 라즈베리파이 워커(카메라 → 이 api 로 결과·사진 전송).
# 절차 전체: deploy/DEPLOYMENT.md
#
# 종전 블루프린트에서 바꾼 것(배포가 실제로 되게):
#   * preDeployCommand(alembic) 삭제 — Render 무료 인스턴스는 pre-deploy 를 지원하지 않는다.
#     대신 AIVIS_MIGRATE_ON_START=true 로 컨테이너가 기동 전에 마이그레이션한다
#     (services/api/docker-entrypoint.sh, 실패하면 기동하지 않는다).
#   * 클라우드 sim 검사 워커 삭제 — 백그라운드 워커는 무료 요금제가 없고, 운영 DB 에 가짜
#     검사결과를 쓴다. 실제 검사는 현장 파이가 한다.
#   * mes-watchdog 워커 삭제 — 재전송 워치독이 api 프로세스 안에서 돈다.
#   * mes(품질·생산실적 MES) 웹서비스 추가.
#   * 관리자 초기 비밀번호를 env 그룹에서 api 로 옮김 — 그룹 안의 sync:false 는 Render 가
#     무시해서, 공개 서버의 admin 비밀번호가 기본값으로 떨어졌다.
#
# Supabase 주소: "Session pooler"(5432, *.pooler.supabase.com, IPv4)를 쓴다. Render 는 IPv4
# 전용이고 Supabase Direct 연결은 IPv6 전용이다. Transaction pooler(6543)는 쓰지 않는다.
# 대시보드에서 복사한 postgresql://… 그대로 붙여도 된다(앱이 psycopg 주소로 바꾼다).
#
# 요금: plan: free 는 15분 무요청이면 잠들고(첫 요청 30~60초), 워크스페이스당 월 750시간
# 상한이다 — 웹서비스 2개를 24시간 돌리면 한 달을 못 버틴다. 생산 라인에 붙이면 api 는
# starter 이상을 권한다(잠들면 파이는 스풀에 보관했다가 깨어나면 보낸다 — 유실은 없다).

databases: []

services:
  # ---------------- AIVIS API (검사결과·기준정보·KPI·권한·MES 연계) ----------------
  - type: web
    name: aivis-api
    runtime: docker
    plan: free
    dockerfilePath: services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Supabase Postgres (Session pooler 주소, 직접 입력)
      - key: DATABASE_URL
        sync: false
      # Vercel 두 도메인(hmi, dashboard) 콤마 목록 — Vercel 배포 후 입력, 끝 슬래시 없음
      - key: ALLOWED_ORIGINS
        sync: false
      # 기동 전 alembic upgrade head (무료 인스턴스에는 pre-deploy 가 없다)
      - key: AIVIS_MIGRATE_ON_START
        value: "true"
      # 서비스 토큰 없이는 기동하지 않는다(공개 서버에서 누구나 검사결과를 쓰지 못하게)
      - key: AIVIS_REQUIRE_SERVICE_TOKEN
        value: "true"
      # 관리자 초기 계정(최초 기동 때 한 번 만든다). 비밀번호는 직접 입력.
      - key: AIVIS_SEED_ON_STARTUP
        value: "true"
      - key: AIVIS_SEED_ADMIN_USER
        value: admin
      - key: AIVIS_SEED_ADMIN_PASSWORD
        sync: false
      # 첫 연결 시험용 데모 품목 HP12(기준정보에 실제 품목을 등록하면 쓰지 않는다)
      - key: AIVIS_SEED_DEMO_ITEM
        value: "true"
      - key: AIVIS_DEMO_ITEM_CODE
        value: HP12
      # 사진: Supabase Storage. 파이는 이 api 로 올리고(api 가 Supabase 로 전달),
      # 화면은 이 api 가 JWT 뒤에서 보여준다 — Supabase 키는 서버에만 둔다.
      - key: AIVIS_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: inspection-images
      # 클라우드 사진 보관기한(일). 지난 사진은 Supabase 에서 지운다(검사 기록은 남는다).
      - key: AIVIS_REMOTE_RETENTION_DAYS
        value: "90"
      - key: MES_MODE
        value: table
      - key: LOG_LEVEL
        value: INFO
      - fromGroup: aivis-shared

  # ---------------- 품질·생산실적 MES (docs/MES.md) ----------------
  - type: web
    name: aivis-mes
    runtime: docker
    plan: free
    dockerfilePath: services/mes/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # api 와 **같은** Supabase 주소. MES 표(mes_*)를 같은 DB 에 두고, 연계 표
      # (mes_quality_if)도 이 주소로 읽는다.
      - key: DATABASE_URL
        sync: false
      # Vercel 대시보드 도메인(MES 화면은 대시보드 메뉴)
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MES_POLL_INTERVAL_S
        value: "10"
      # REST 수신은 클라우드에서 쓰지 않는다(테이블 폴링) — 아무나 못 넣게 잠근다.
      - key: MES_INTAKE_TOKEN
        generateValue: true
      - fromGroup: aivis-shared

# ---------------- 공유 비밀(그룹) ----------------
# JWT_SECRET: api·mes 가 같아야 로그인 하나로 MES 화면이 열린다.
# AIVIS_SERVICE_TOKEN: 현장 파이 워커가 X-Service-Token 으로 보낸다 — 이 값을 파이의
#   /etc/aivis/worker.env 에 그대로 넣는다(Render 대시보드 → Env Groups 에서 확인).
# (그룹 안에서는 sync:false 가 무시되므로 직접 입력값은 서비스 쪽에 둔다.)
envVarGroups:
  - name: aivis-shared
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: AIVIS_SERVICE_TOKEN
        generateValue: true
